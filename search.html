<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Player — StrategyHub</title>
    <link rel="stylesheet" href="styles.css?v=11" />
    <link rel="stylesheet" href="search.css?v=1" />
  </head>
  <body>
    <nav class="top-nav">
      <div class="nav-brand">StrategyHub</div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Strategy Map</a>
        <a href="draft.html" class="nav-link">Draft Pick/Ban</a>
        <a href="leaderboard.html" class="nav-link">Leaderboard</a>
        <a href="champions.html" class="nav-link">Champions</a>
        <a href="search.html" class="nav-link active">Search</a>
      </div>
    </nav>

    <div class="api-warning">⚠ Waiting for the Riot API — sorry for the inconvenience.</div>

    <div class="search-container">
      <!-- Search Bar -->
      <div class="search-bar-section">
        <div class="search-bar-wrap">
          <input type="text" id="searchInput" class="search-input" placeholder="Player Name#Tag  (e.g. Faker#KR1)" autocomplete="off" />
          <select id="regionSelect" class="search-region-select">
            <option value="br1" selected>BR</option>
            <option value="na1">NA</option>
            <option value="euw1">EUW</option>
            <option value="eun1">EUNE</option>
            <option value="kr">KR</option>
            <option value="la1">LAS</option>
            <option value="la2">LAN</option>
            <option value="jp1">JP</option>
            <option value="oc1">OCE</option>
            <option value="tr1">TR</option>
            <option value="ru">RU</option>
            <option value="ph2">PH</option>
            <option value="sg2">SG</option>
            <option value="th2">TH</option>
            <option value="tw2">TW</option>
            <option value="vn2">VN</option>
          </select>
          <button id="searchBtn" class="search-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            Search
          </button>
        </div>
      </div>

      <!-- Loading -->
      <div id="loadingState" class="loading-state" style="display:none;">
        <div class="spinner"></div>
        <p id="loadingText">Searching player...</p>
      </div>

      <!-- Error -->
      <div id="errorState" class="error-state" style="display:none;">
        <p id="errorMessage"></p>
      </div>

      <!-- Player Profile Card -->
      <div id="profileSection" class="profile-section" style="display:none;">
        <div class="profile-card">
          <img id="profileIcon" class="profile-icon" src="" alt="Icon" />
          <div class="profile-info">
            <div class="profile-name">
              <span id="playerName"></span>
              <span id="playerTag" class="profile-tag"></span>
            </div>
            <div class="profile-level">Level <span id="playerLevel"></span></div>
          </div>
          <div id="rankBadge" class="rank-badge-card">
            <img id="rankIcon" class="rank-icon" src="" alt="" />
            <div class="rank-details">
              <div id="rankTier" class="rank-tier"></div>
              <div id="rankLP" class="rank-lp"></div>
              <div id="rankWL" class="rank-wl"></div>
              <div id="rankWR" class="rank-wr"></div>
            </div>
          </div>
          <div id="rankPosition" class="rank-position" style="display:none;">
            <span class="position-label">Server Rank</span>
            <span id="positionValue" class="position-value"></span>
          </div>
        </div>
      </div>

      <!-- Champion Pool -->
      <div id="champPoolSection" class="section-card" style="display:none;">
        <h3 class="section-title">Champion Pool <span id="champPoolGames" class="section-sub"></span></h3>
        <div id="champPoolGrid" class="champ-pool-grid"></div>
      </div>

      <!-- Match History -->
      <div id="matchHistorySection" class="section-card" style="display:none;">
        <h3 class="section-title">Match History <span id="matchCount" class="section-sub"></span></h3>
        <div id="matchList" class="match-list"></div>
      </div>
    </div>

    <script src="search.js?v=1"></script>
  </body>
</html>
