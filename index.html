<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Strategy Map</title>
    <link rel="stylesheet" href="styles.css?v=11" />
  </head>
  <body>
    <nav class="top-nav">
      <div class="nav-brand">StrategyHub</div>
      <div class="nav-links">
        <a href="index.html" class="nav-link active">Strategy Map</a>
        <a href="draft.html" class="nav-link">Draft Pick/Ban</a>
      </div>
    </nav>
    <div class="main-content">
    <aside class="toolbar">
      <button id="selectBtn" class="tool-btn" title="Select/Move (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
          <path d="M13 13l6 6"/>
        </svg>
      </button>
      <div class="draw-btn-wrapper">
        <button id="drawBtn" class="tool-btn" title="Draw (D)">
          <svg id="drawBtnIconPen" class="draw-btn-icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            <path d="M2 2l7.586 7.586"/>
          </svg>
          <svg id="drawBtnIconArrow" class="draw-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14"/>
            <path d="M13 5l7 7-7 7"/>
          </svg>
          <span id="colorIndicator" class="color-indicator"></span>
        </button>
        <div id="colorPicker" class="color-picker">
          <div class="draw-mode-toggle">
            <button class="draw-mode-btn active" data-submode="pen" title="Pen">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg>
            </button>
            <button class="draw-mode-btn" data-submode="arrow" title="Arrow">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>
            </button>
          </div>
          <div class="picker-divider"></div>
          <div class="color-option" data-color="#ef4444" title="Red"></div>
          <div class="color-option" data-color="#f97316" title="Orange"></div>
          <div class="color-option" data-color="#3b82f6" title="Blue"></div>
          <div class="color-option" data-color="#ffffff" title="White"></div>
          <div class="color-option" data-color="#eab308" title="Yellow"></div>
        </div>
      </div>
      <button id="eraseBtn" class="tool-btn" title="Erase (E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 20H7L3 16c-.6-.6-.6-1.5 0-2.1l10-10c.6-.6 1.5-.6 2.1 0l6 6c.6.6.6 1.5 0 2.1L13 20"/>
          <path d="M6 11l8 8"/>
        </svg>
      </button>
      <div class="divider"></div>
      <div class="size-control">
        <label class="size-label">Size</label>
        <input type="range" id="brushSize" min="1" max="30" value="4" class="size-slider" title="Brush/Erase Size">
        <span id="sizeValue" class="size-value">4</span>
      </div>
      <div class="divider"></div>
      <button id="clearBtn" class="tool-btn" title="Clear All">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18"/>
          <path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
          <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        </svg>
      </button>
      <button id="recenterBtn" class="tool-btn" title="Recenter Map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v4"/>
          <path d="M12 18v4"/>
          <path d="M2 12h4"/>
          <path d="M18 12h4"/>
        </svg>
      </button>
      <div class="divider"></div>
      <div class="marker-group">
        <div class="marker blue" data-team="blue" data-role="top" data-index="0" draggable="true" title="Blue Top"></div>
        <div class="marker blue" data-team="blue" data-role="jg" data-index="1" draggable="true" title="Blue Jungle"></div>
        <div class="marker blue" data-team="blue" data-role="mid" data-index="2" draggable="true" title="Blue Mid"></div>
        <div class="marker blue" data-team="blue" data-role="bot" data-index="3" draggable="true" title="Blue Bot"></div>
        <div class="marker blue" data-team="blue" data-role="sup" data-index="4" draggable="true" title="Blue Support"></div>
      </div>
      <div class="marker-group">
        <div class="marker red" data-team="red" data-role="top" data-index="0" draggable="true" title="Red Top"></div>
        <div class="marker red" data-team="red" data-role="jg" data-index="1" draggable="true" title="Red Jungle"></div>
        <div class="marker red" data-team="red" data-role="mid" data-index="2" draggable="true" title="Red Mid"></div>
        <div class="marker red" data-team="red" data-role="bot" data-index="3" draggable="true" title="Red Bot"></div>
        <div class="marker red" data-team="red" data-role="sup" data-index="4" draggable="true" title="Red Support"></div>
      </div>
      <div class="divider"></div>
      <div class="minion-btn-wrapper">
        <div id="activeMinion" class="minion blue-minion" data-minion-team="blue" draggable="true" title="Minion Wave"></div>
        <div id="minionPicker" class="minion-picker">
          <div class="minion-option" data-minion-team="blue" title="Blue Minion">
            <div class="minion-preview blue-minion"></div>
          </div>
          <div class="minion-option" data-minion-team="red" title="Red Minion">
            <div class="minion-preview red-minion"></div>
          </div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="ward-group">
        <div class="ward green-ward" data-ward-type="green" draggable="true" title="Green Ward">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="6"/>
          </svg>
        </div>
        <div class="ward pink-ward" data-ward-type="pink" draggable="true" title="Pink Ward">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="6"/>
          </svg>
        </div>
      </div>
      <div class="divider"></div>
      <button id="toggleTowersBtn" class="tool-btn tower-toggle active" title="Toggle Towers (T)">
        <img src="image/Turretico.png" alt="Tower" class="tower-icon">
      </button>
      <button id="toggleMonstersBtn" class="tool-btn monster-toggle active" title="Toggle Monsters (M)">
        <img src="image/Monstericon.png" alt="Monsters" class="monster-icon">
      </button>
      <div class="divider"></div>
      <div class="size-control">
        <label class="size-label">Marker</label>
        <input type="range" id="markerSize" min="12" max="40" value="16" class="size-slider" title="Marker Size">
        <span id="markerSizeValue" class="size-value">16</span>
      </div>
    </aside>

    <main class="canvas-wrap">
      <canvas id="strategyCanvas"></canvas>
    </main>

    <aside class="right-panel">
      <button id="hamburgerBtn" class="hamburger-btn" title="Toggle Panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18"/>
          <path d="M3 6h18"/>
          <path d="M3 18h18"/>
        </svg>
      </button>
      <div class="panel-content">
        <!-- Draft Select -->
        <div class="draft-section">
          <h3 class="draft-title blue-title">Blue Team</h3>
          <div class="draft-slots" data-team="blue">
            <div class="draft-slot" data-role="top" data-team="blue">
              <span class="role-name">TOP</span>
              <div class="role-icon" data-role="top" data-team="blue"></div>
            </div>
            <div class="draft-slot" data-role="jg" data-team="blue">
              <span class="role-name">JG</span>
              <div class="role-icon" data-role="jg" data-team="blue"></div>
            </div>
            <div class="draft-slot" data-role="mid" data-team="blue">
              <span class="role-name">MID</span>
              <div class="role-icon" data-role="mid" data-team="blue"></div>
            </div>
            <div class="draft-slot" data-role="bot" data-team="blue">
              <span class="role-name">BOT</span>
              <div class="role-icon" data-role="bot" data-team="blue"></div>
            </div>
            <div class="draft-slot" data-role="sup" data-team="blue">
              <span class="role-name">SUP</span>
              <div class="role-icon" data-role="sup" data-team="blue"></div>
            </div>
          </div>
        </div>

        <div class="draft-section">
          <h3 class="draft-title red-title">Red Team</h3>
          <div class="draft-slots" data-team="red">
            <div class="draft-slot" data-role="top" data-team="red">
              <span class="role-name">TOP</span>
              <div class="role-icon" data-role="top" data-team="red"></div>
            </div>
            <div class="draft-slot" data-role="jg" data-team="red">
              <span class="role-name">JG</span>
              <div class="role-icon" data-role="jg" data-team="red"></div>
            </div>
            <div class="draft-slot" data-role="mid" data-team="red">
              <span class="role-name">MID</span>
              <div class="role-icon" data-role="mid" data-team="red"></div>
            </div>
            <div class="draft-slot" data-role="bot" data-team="red">
              <span class="role-name">BOT</span>
              <div class="role-icon" data-role="bot" data-team="red"></div>
            </div>
            <div class="draft-slot" data-role="sup" data-team="red">
              <span class="role-name">SUP</span>
              <div class="role-icon" data-role="sup" data-team="red"></div>
            </div>
          </div>
        </div>

        <div class="divider-horizontal"></div>

        <!-- Champion Grid -->
        <div class="panel-section">
          <input type="text" id="championSearch" class="champion-search" placeholder="Search champions...">
          <div id="championGrid" class="champion-grid">
            <!-- Champions loaded dynamically -->
          </div>
        </div>
      </div>
    </aside>
    </div><!-- end main-content -->

    <!-- Shortcuts Hint -->
    <div id="shortcutsHint" class="shortcuts-hint">
      <div class="shortcuts-title">Controls</div>
      <div class="shortcut-item"><span class="shortcut-key">A</span> Select/Move</div>
      <div class="shortcut-item"><span class="shortcut-key">D</span> Draw</div>
      <div class="shortcut-item"><span class="shortcut-key">E</span> Erase</div>
      <div class="shortcut-item"><span class="shortcut-key">Ctrl+Z</span> Undo</div>
      <div class="shortcut-item"><span class="shortcut-key mouse-icon">🖱</span> Pan Map</div>
      <div class="shortcut-item"><span class="shortcut-key scroll-icon">⇅</span> Zoom</div>
    </div>

    <!-- Collaboration UI -->
    <div id="collabPanel" class="collab-panel">
      <div id="connectionStatus" class="connection-status offline">
        <span class="status-dot"></span>
        <span class="status-text">Offline</span>
      </div>
      <button id="shareBtn" class="share-btn" title="Collaborate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <path d="M8.59 13.51l6.83 3.98"/>
          <path d="M15.41 6.51l-6.82 3.98"/>
        </svg>
        <span>Collab</span>
      </button>
      <div id="usersOnline" class="users-online" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span id="userCount">1</span>
      </div>
    </div>

    <!-- Share Modal -->
    <div id="shareModal" class="share-modal" style="display: none;">
      <div class="share-modal-content">
        <div class="share-modal-header">
          <h3>Share This Map</h3>
          <button id="closeShareModal" class="close-modal-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
              <path d="M18 6L6 18"/>
              <path d="M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="share-modal-body">
          <p>Share this link with others to collaborate in real-time:</p>
          <div class="share-link-container">
            <input type="text" id="shareLink" class="share-link-input" readonly>
            <button id="copyLinkBtn" class="copy-link-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <span>Copy</span>
            </button>
          </div>
          <div id="copySuccess" class="copy-success" style="display: none;">Link copied to clipboard!</div>
        </div>
        <div class="share-modal-footer">
          <button id="newRoomBtn" class="new-room-btn">Create New Room</button>
        </div>
      </div>
    </div>

    <script src="vendor/fabric.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="app.js?v=57"></script>
  </body>
</html>
